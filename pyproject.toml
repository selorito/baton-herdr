[project]
name = "baton-herdr"
version = "0.1.0"
description = "Orchestrator that keeps coding agents running on herdr until their tasks are done."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/selorito/baton-herdr"
Issues = "https://github.com/selorito/baton-herdr/issues"

[project.scripts]
baton = "baton_herdr.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT", "PTH", "RET",
  "ARG", "ASYNC", "DTZ", "T20", "TID", "TC", "PL", "PERF", "ERA", "BLE", "FBT", "LOG", "G",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Tests quote real terminal output, including glyphs such as U+276F and U+203A.
# Live tests poll a real herdr; there is no event to wait on.
"tests/**" = ["S101", "PLR2004", "PLR0911", "ARG", "RUF001", "ASYNC110", "FBT001"]
# Standalone capture tool: shells out to the herdr and agent CLIs by design.
"tools/**" = ["S603", "S607"]
# The benchmark draws simulated timings from a seeded generator and prints agent glyphs.
"bench/**" = ["S311", "RUF001"]

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates annotations at runtime; keep their imports out of TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.isort]
# tools/capture/capture.py is imported by its tests as a local module.
known-local-folder = ["capture", "detect_corpus", "detector_binary", "fake_agent", "simulated_agents"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools", "bench"]
mypy_path = "tools/capture:tools/fake-agent:tests/support:bench"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tools/capture", "tools/fake-agent", "tests/support", "bench"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra", "-m", "not live"]
markers = [
  "live: needs a real herdr binary; excluded by default, run with `just smoke`",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["baton_herdr"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "baton_herdr"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "core-is-pure"
name = "baton_herdr.core imports no other baton package"
type = "forbidden"
source_modules = ["baton_herdr.core"]
forbidden_modules = [
  "baton_herdr.herdr", "baton_herdr.adapters", "baton_herdr.ledger",
  "baton_herdr.recovery", "baton_herdr.budget", "baton_herdr.scheduler",
  "baton_herdr.api", "baton_herdr.telegram", "baton_herdr.cli", "baton_herdr.daemon",
  "baton_herdr.collector", "baton_herdr.detector", "baton_herdr.workdir",
]

[[tool.importlinter.contracts]]
id = "layers"
name = "interfaces -> services -> infra -> core"
type = "layers"
containers = ["baton_herdr"]
exhaustive = true
layers = [
  "api : telegram : cli : daemon : doctor : service",
  "recovery : budget : scheduler",
  "herdr | adapters | ledger | collector | detector | workdir",
  "core",
]

[[tool.importlinter.contracts]]
id = "adapters-independent"
name = "agent adapters do not import each other"
type = "independence"
modules = ["baton_herdr.adapters.*"]

[[tool.importlinter.contracts]]
id = "only-ledger-touches-the-database"
name = "only baton_herdr.ledger imports database libraries"
type = "forbidden"
source_modules = [
  "baton_herdr.core", "baton_herdr.herdr", "baton_herdr.adapters",
  "baton_herdr.recovery", "baton_herdr.budget", "baton_herdr.scheduler",
  "baton_herdr.api", "baton_herdr.telegram", "baton_herdr.cli", "baton_herdr.daemon",
  "baton_herdr.collector", "baton_herdr.detector", "baton_herdr.workdir",
]
forbidden_modules = ["sqlalchemy", "aiosqlite", "alembic", "sqlite3"]
# Using baton_herdr.ledger is the point; importing the libraries directly is what is forbidden.
allow_indirect_imports = true
