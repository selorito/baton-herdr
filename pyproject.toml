[project]
name = "coban"
version = "0.0.0"
description = "Orchestrator that keeps coding agents running on herdr until their tasks are done."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
]

[project.scripts]
coban = "coban.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT", "PTH", "RET",
  "ARG", "ASYNC", "DTZ", "T20", "TID", "TC", "PL", "PERF", "ERA", "BLE", "FBT", "LOG", "G",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
# Standalone capture tool: shells out to the herdr and agent CLIs by design.
"tools/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates annotations at runtime; keep their imports out of TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.isort]
# tools/capture/capture.py is imported by its tests as a local module.
known-local-folder = ["capture"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
mypy_path = "tools/capture"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tools/capture"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["coban"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "coban"

[[tool.importlinter.contracts]]
id = "core-is-pure"
name = "coban.core imports no other coban package"
type = "forbidden"
source_modules = ["coban.core"]
forbidden_modules = [
  "coban.herdr", "coban.adapters", "coban.ledger",
  "coban.recovery", "coban.budget", "coban.scheduler",
  "coban.api", "coban.telegram", "coban.cli",
]

[[tool.importlinter.contracts]]
id = "layers"
name = "interfaces -> services -> infra -> core"
type = "layers"
containers = ["coban"]
exhaustive = true
layers = [
  "api : telegram : cli",
  "recovery : budget : scheduler",
  "herdr | adapters | ledger",
  "core",
]

[[tool.importlinter.contracts]]
id = "adapters-independent"
name = "agent adapters do not import each other"
type = "independence"
modules = ["coban.adapters.*"]
