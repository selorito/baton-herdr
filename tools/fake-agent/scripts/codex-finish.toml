# Codex CLI that takes a prompt, works briefly and finishes.
# Screens and titles follow fixtures/codex/: while working, Codex puts a braille spinner
# in the window title (herdr's osc_title_working rule) and at the end of the footer.
agent = "codex"

[[step]]
title = "baton-sandbox"
wait = "prompt"
screen = """
╭──────────────────────────────────────────╮
│ >_ OpenAI Codex (fake)                   │
│ directory: ~/dev/baton-sandbox           │
╰──────────────────────────────────────────╯

› Ask Codex to do anything
  fake-model · ~/dev/baton-sandbox
"""

[[step]]
title = "⠏ | baton-sandbox"
wait = 2
screen = """
› {prompt}

• Working (2s • esc to interrupt)

› Ask Codex to do anything
  fake-model · ~/dev/baton-sandbox · ⠏
"""

[[step]]
title = "baton-sandbox"
wait = "forever"
screen = """
› {prompt}

• Added power(a, b) to calc.py with a test. All tests pass.

› Ask Codex to do anything
  fake-model · ~/dev/baton-sandbox
"""
