# Example baton configuration. Copy to ./baton.toml or point BATON_CONFIG at it.
# Every key can be overridden by an environment variable:
#   BATON_<SECTION>__<KEY>, e.g. BATON_LOGGING__LEVEL=debug
# Secrets (e.g. BATON_TELEGRAM__BOT_TOKEN) belong in .env, never in this file.

[herdr]
# The herdr session baton's agents run in: <config_dir>/sessions/<session>/herdr.sock,
# where <config_dir> is $XDG_CONFIG_HOME/herdr or ~/.config/herdr. `baton service install`
# runs a herdr server for this same session; watch it with `herdr --session baton`.
# "default" means herdr's own default socket instead.
session = "baton"
# HERDR_SOCKET_PATH (set by herdr inside its panes) and an explicit socket_path take
# precedence over the session; `baton doctor` says when that misses the service.
# socket_path = "~/.config/herdr/herdr.sock"

[database]
path = "~/.local/share/baton/baton.db"

[logging]
# debug | info | warning | error | critical
level = "info"

[scheduler]
# Agents in order of preference; a task moves on when one hits its usage limit.
agents = ["claude", "codex"]
# Used when an agent hits a limit without printing when it resets.
limit_cooldown_minutes = 60
# Zone for reading times agents print ("resets 3:45pm"). Set it to your own.
timezone = "UTC"

[usage]
# batond runs baton-detect to record the tokens agents use (ADR 0011).
# enabled = true
# binary = "baton-detect"           # a name on PATH, or a path
# The agents' log locations, if not their defaults:
# claude_dir = "~/.claude/projects"
# codex_dir = "~/.codex/sessions"
# opencode_db = "~/.local/share/opencode/opencode.db"

[detector]
# Which screen classifier batond uses (ADR 0011): "python" (the default), "shadow" (Python
# decides; baton-detect classify answers too and differences are logged as "detector
# mismatch"), or "rust" (baton-detect decides, Python answers while it is unavailable).
# engine = "python"
# binary = "baton-detect"

[budget]
# How agent choice weighs what each agent has left (ADR 0012). An agent with less than
# this share left goes behind the others; it is never skipped for budget alone.
# reserve_percent = 10
# Claude Code does not report its limits. Its 5-hour session budget in counted tokens
# (input + cache writes + output) turns baton's records into an estimate. Unset: learned
# from the last session limit baton saw, else unknown.
# claude_window_tokens = 3000000

[telegram]
# Numeric id of the one private chat baton sends to. The bot token goes in .env:
# BATON_TELEGRAM__BOT_TOKEN=...
# chat_id = 123456789
# Your own Telegram user id. Only you can then approve, deny, answer and ask /status,
# and only in that chat. Without it the bot only sends notices.
# owner_id = 123456789

